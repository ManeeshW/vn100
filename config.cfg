# IMU Configuration File
# This file configures the VN100 IMU sensor.
# Keys are case-sensitive and follow the format IMU.key = value
# Supported keys:
# - IMU.on: 1 to enable, 0 to disable (default: 1)
# - IMU.port: Serial port path (default: /dev/ttyTHS1)
# - IMU.baud_rate: Baud rate (default: 230400)
# - IMU.port_num: 1 for PORT1, 2 for PORT2 (default: 2)
# - IMU.mag_declination: Magnetic declination in degrees (default: 0.0)
# - IMU.frequency: Sensor output frequency in Hz, must divide 800 evenly (default: 200)
# - IMU.zenoh_topic: Zenoh key expression to publish IMU data on (default: fdcl/imu)
# - IMU.zenoh_publish_rate: Zenoh publish rate in Hz, must be <= IMU.frequency (default: 200)
# Positive values for east declination, negative for west.
#
# Butterworth low-pass filter settings:
# - IMU.use_butterworth: 1 to enable Butterworth filtering, 0 to disable (default: 0)
# - IMU.gyro_butter_order: Filter order for gyroscope (default: 2)
# - IMU.gyro_butter_cutoff: Cutoff frequency in Hz for gyroscope filter (default: 30.0)
# - IMU.accel_butter_order: Filter order for accelerometer (default: 2)
# - IMU.accel_butter_cutoff: Cutoff frequency in Hz for accelerometer filter (default: 30.0)
#   Cutoff must be > 0 and < IMU.frequency / 2 (Nyquist limit).
#   Higher order = sharper rolloff but more phase lag. Order 2-4 is typical.
#
# Filtered IMU publishing:
# - IMU.publish_filtered_imu: 1 to publish filtered data on a separate Zenoh topic (default: 0)
# - IMU.filtered_imu_topic: Zenoh key for filtered IMU data (default: fdcl/imu_filtered)
#   The raw topic (IMU.zenoh_topic) always includes both raw and filtered fields.
#   The filtered topic publishes only the filtered ang_rate and accel.

IMU.on = 1
IMU.port = /dev/cu.usbserial-0001
IMU.baud_rate = 230400
IMU.port_num = 2
IMU.mag_declination = 0.0
IMU.frequency = 200
IMU.zenoh_topic = fdcl/imu
IMU.zenoh_publish_rate = 200

# Butterworth filter
IMU.use_butterworth = 1
IMU.gyro_butter_order = 2
IMU.gyro_butter_cutoff = 30.0
IMU.accel_butter_order = 2
IMU.accel_butter_cutoff = 30.0

# Filtered IMU publisher
IMU.publish_filtered_imu = 0
IMU.filtered_imu_topic = fdcl/base_imu