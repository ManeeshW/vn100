[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"
[project]
name = "vn100"
version = "0.1.0"
description = "Python bindings for VectorNav VN100 IMU"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
"Programming Language :: Python :: 3",
"License :: OSI Approved :: MIT License",  # Adjust if needed
]
[tool.scikit-build]
cmake.args = ["-DCMAKE_BUILD_TYPE=Release"]  # Optional: Customize CMake build